<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemistry Lineage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&family=Schibsted+Grotesk:wght@600;800&display=swap">
<style>
/* Same dark palette as map.html, so the two views feel like one tool. */
:root {
  --bg: #0b1016; --panel: #111921; --panel-2: #16202a; --ink: #e8eef3; --muted: #93a4b1; --line: #263440; --accent: #7fb2ff; --gold: #ffd166;
  --f-display: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --side: 23rem;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); overflow: hidden; }
body { display: grid; grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "top top" "stage side" "player side"; }
button { font: inherit; color: inherit; }

/* ---- top bar ---- */
.top { grid-area: top; display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1.2rem; padding: .8rem 1.2rem .7rem; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { margin-right: auto; min-width: 0; }
.eyebrow { font: 500 .66rem var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0; }
h1 { font: 800 1.55rem/1.05 var(--f-display); letter-spacing: -.02em; margin: .15rem 0 0; }
h1 i { color: #ff6b5e; font-style: normal; }
.tabs { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.tabs button { border: 0; background: none; color: var(--muted); font-weight: 700; font-size: .85rem; padding: .45rem .8rem; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--accent); color: #0b1016; }
.years button { display: grid; line-height: 1.15; padding: .3rem .7rem; text-align: center; }
.years button small { font: 500 .6rem var(--f-mono); letter-spacing: .04em; text-transform: uppercase; opacity: .8; }
.years button[aria-pressed="true"] { background: var(--gold); color: #0b1016; }
.tools { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.searchbox { position: relative; }
.searchbox input { width: 13rem; font: inherit; font-size: .86rem; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: .42rem .6rem; }
.results { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-width: 15rem; }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); font-size: .85rem; padding: .4rem .6rem; cursor: pointer; }
.results button:first-child { border-top: 0; }
.results button:hover, .results button:focus-visible { background: rgb(127 178 255 / .15); outline: none; }
.results small { color: var(--muted); }
select { font: inherit; font-size: .84rem; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: .4rem .4rem; }
.tools label { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: .35rem; }
.tools a { font-weight: 700; font-size: .82rem; color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: .42rem .6rem; white-space: nowrap; }
.picker { flex-basis: 100%; display: flex; gap: .4rem; align-items: center; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; min-height: 2rem; }
.picker .lbl { font: 500 .66rem var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); white-space: nowrap; margin-right: .2rem; }
.chip { display: inline-flex; align-items: center; gap: .4rem; border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: .25rem .7rem; font-size: .82rem; cursor: pointer; white-space: nowrap; }
.chip .dot { width: .55rem; height: .55rem; border-radius: 50%; flex: none; }
.chip .n { color: var(--muted); font: 500 .7rem var(--f-mono); }
.chip[aria-pressed="true"] { border-color: var(--gold); background: rgb(255 209 102 / .12); }
.chip:hover { border-color: #3c5162; }

/* ---- stage ---- */
.stage { grid-area: stage; position: relative; min-height: 0; overflow: hidden; }
svg#svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
svg#svg.dragging { cursor: grabbing; }
.band { fill: rgb(255 255 255 / .022); stroke: rgb(255 255 255 / .05); }
.band-lbl { font: 800 15px var(--f-display); fill: #c3cfd8; }
.band-sub { font: 500 10.5px var(--f-mono); fill: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.edge { fill: none; stroke: #1c2731; stroke-width: 1.2; transition: stroke .4s, opacity .4s; }
.edge.soft { stroke-dasharray: 4 4; }
.edge.ghost { stroke: #2a3a47; }
.edge.lit { stroke: rgb(199 214 226 / .55); stroke-width: 1.6; }
.edge.off { opacity: 0; }
.edge.ghost { opacity: .45; }
.node { cursor: pointer; transition: opacity .4s; }
.node rect.box { fill: #121a22; stroke: #26343f; stroke-width: 1.2; transition: fill .4s, stroke .4s; }
.node rect.bar { transition: opacity .4s; }
.node text { font: 700 12px var(--f-body); fill: #6f8291; transition: fill .4s; pointer-events: none; }
.node.off { opacity: 0; pointer-events: none; }
.node.ghost { opacity: .32; }
.node.ghost rect.bar { opacity: .25; }
.node.on text { fill: var(--ink); }
.node.focus rect.box { stroke: #fff; stroke-width: 2.4; }
.node:hover rect.box { stroke: #8aa0b2; }
.node.reveal .inner { animation: reveal 1.1s ease-out; }
@keyframes reveal { from { opacity: .2; } to { opacity: 1; } }
.node.bridge .inner { opacity: .62; }
.node.bridge rect.box { stroke-dasharray: 5 4; }
.node.ctx .inner { opacity: .5; }
.node.ctx rect.box { stroke-dasharray: 2 3; }
.band.ctx { fill: rgb(255 255 255 / .008); stroke-dasharray: 6 6; }
.flag { fill: #ff6b8b; }
.learn { cursor: pointer; }
.learn circle { fill: #5cc48a; transition: r .15s; }
.learn:hover circle { r: 9; }
.learn path { fill: #0b1016; }
.learnbtn { display: grid; grid-template-columns: 2rem 1fr; gap: .1rem .6rem; align-items: center; text-decoration: none; color: var(--ink); background: rgb(92 196 138 / .1); border: 1px solid #5cc48a; border-radius: 10px; padding: .55rem .7rem; margin-bottom: .4rem; }
.learnbtn:hover { background: rgb(92 196 138 / .2); }
.learnbtn .ic { grid-row: span 2; width: 2rem; height: 2rem; border-radius: 50%; background: #5cc48a; color: #0b1016; display: grid; place-items: center; font-size: .8rem; }
.learnbtn b { font-size: .9rem; }
.learnbtn small { color: var(--muted); font-size: .76rem; }
.warn { position: absolute; left: 12px; top: 10px; font-size: .74rem; color: var(--muted); background: rgb(11 16 22 / .8); border: 1px solid var(--line); border-radius: 6px; padding: .2rem .5rem; pointer-events: none; }
.choose { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; overflow-y: auto; background: radial-gradient(ellipse at center, rgb(11 16 22 / .82) 40%, rgb(11 16 22 / .35)); z-index: 3; }
.choose[hidden] { display: none; }
.choose .card { width: min(44rem, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1.4rem 1.5rem 1.3rem; box-shadow: 0 20px 60px rgb(0 0 0 / .45); }
.choose h2 { font: 800 clamp(1.4rem, 3vw, 1.9rem)/1.1 var(--f-display); margin: .3rem 0 .5rem; letter-spacing: -.01em; }
.choose p { color: #c9d4dc; margin: 0 0 1rem; font-size: .95rem; }
.starts { display: grid; grid-template-columns: repeat(auto-fill, minmax(12.5rem, 1fr)); gap: .5rem; }
.start { display: grid; grid-template-columns: .8rem 1fr; gap: .1rem .6rem; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: .6rem .7rem; cursor: pointer; }
.start:hover, .start:focus-visible { border-color: var(--accent); outline: none; background: rgb(127 178 255 / .08); }
.start .dot { width: .8rem; height: .8rem; border-radius: 50%; margin-top: .25rem; box-shadow: 0 0 10px currentColor; }
.start b { font-size: .92rem; line-height: 1.25; }
.start small { grid-column: 2; color: var(--muted); font-size: .78rem; }
.start .desc { grid-column: 2; color: #c3cfd8; font-size: .8rem; line-height: 1.35; }
.choose .all { margin-top: 1rem; background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0; font-size: .9rem; }
.choose .all:hover { text-decoration: underline; }
.chip.ctl { color: var(--accent); font-weight: 700; }
.zoom { position: absolute; right: 12px; top: 10px; display: flex; gap: .3rem; }
.zoom button { min-width: 2.1rem; height: 2.1rem; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; cursor: pointer; padding: 0 .5rem; font-size: .85rem; }

/* ---- player ---- */
.player { grid-area: player; border-top: 1px solid var(--line); background: var(--panel); padding: .6rem 1rem .7rem; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .3rem 1rem; align-items: center; }
.controls { display: flex; align-items: center; gap: .3rem; }
.controls button { width: 2.2rem; height: 2.2rem; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; font-size: .9rem; line-height: 1; }
.controls button#play { width: 2.7rem; height: 2.7rem; background: var(--accent); color: #0b1016; border: 0; font-size: 1.05rem; }
.controls select { margin-left: .3rem; }
.caption { min-width: 0; }
.caption .ct { display: flex; align-items: baseline; gap: .6rem; }
.caption .ct b { font: 800 1.02rem/1.2 var(--f-display); }
.caption .ct span { color: var(--muted); font: 500 .7rem var(--f-mono); white-space: nowrap; }
.caption .chips { display: flex; gap: .35rem; overflow-x: auto; scrollbar-width: thin; margin-top: .3rem; padding-bottom: 2px; }
.caption .chip { font-size: .78rem; padding: .15rem .6rem; }
input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
.sheet-btn { display: none; }

/* ---- side panel ---- */
.side { grid-area: side; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 1rem 1.1rem 1.4rem; min-height: 0; }
.side h2 { font: 800 1.3rem/1.15 var(--f-display); margin: .25rem 0 .5rem; }
.side p { margin: 0 0 .6rem; color: #c9d4dc; font-size: .9rem; }
.side .fine { color: var(--muted); font-size: .8rem; }
.back { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: .15rem .55rem; cursor: pointer; font-size: .8rem; }
.crumb { display: flex; align-items: center; gap: .4rem; font: 500 .68rem var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: .7rem; }
.crumb .dot { width: .55rem; height: .55rem; border-radius: 50%; }
.sub { font: 500 .66rem var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 1.1rem 0 .4rem; }
.big { display: flex; align-items: baseline; gap: .5rem; margin: .5rem 0 .3rem; }
.big b { font: 800 1.9rem var(--f-display); font-variant-numeric: tabular-nums; }
.big span { color: var(--muted); font-size: .85rem; }
.list { display: grid; gap: .1rem; }
.item { display: grid; grid-template-columns: .6rem minmax(0, 1fr) auto; gap: .55rem; align-items: start; background: none; border: 0; text-align: left; font-size: .87rem; padding: .3rem .25rem; border-radius: 6px; cursor: pointer; width: 100%; }
.item:hover, .item:focus-visible { background: rgb(255 255 255 / .06); outline: none; }
.item .dot { width: .55rem; height: .55rem; border-radius: 50%; margin-top: .42rem; }
.item .why { display: block; color: var(--muted); font-size: .78rem; }
.item .yr { color: var(--muted); font: 500 .68rem var(--f-mono); white-space: nowrap; margin-top: .18rem; }
.actions { display: flex; gap: .4rem; flex-wrap: wrap; margin: .6rem 0 .2rem; }
.actions button { border: 1px solid var(--accent); background: rgb(127 178 255 / .1); color: var(--accent); font-weight: 700; font-size: .82rem; border-radius: 8px; padding: .35rem .65rem; cursor: pointer; }
.quote { border-left: 2px solid var(--line); padding-left: .6rem; font-size: .85rem; color: #c9d4dc; margin-bottom: .4rem; }
.quote small { display: block; color: var(--muted); font: 500 .68rem var(--f-mono); margin-top: .1rem; }
.tag { display: inline-block; font-size: .74rem; border: 1px solid var(--line); border-radius: 999px; padding: .05rem .5rem; color: var(--muted); margin: 0 .25rem .25rem 0; }
.tag.hot { color: #ff8a7a; border-color: #ff8a7a; }
.tag.ben { color: #f0b35a; border-color: #f0b35a; }
.go { color: var(--accent); font-weight: 700; text-decoration: none; }
.go:hover { text-decoration: underline; }
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: .15rem .6rem; font-size: .8rem; }
.keys span { display: flex; align-items: center; gap: .4rem; }
.keys i { width: .65rem; height: .65rem; border-radius: 3px; flex: none; }
ul.ev { margin: 0 0 .4rem; padding-left: 1.1rem; font-size: .86rem; color: #c9d4dc; }

@media (max-width: 900px) {
  body { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "stage" "player"; }
  .top { padding: .6rem 16px .5rem; gap: .45rem .6rem; }
  h1 { font-size: 1.2rem; }
  .eyebrow { display: none; }
  .tools { flex-basis: 100%; }
  .searchbox { flex: 1; min-width: 0; }
  .searchbox input { width: 100%; }
  .tools label span { display: none; }
  .tools a.opt { display: none; }
  .player { padding: .5rem 16px .6rem; grid-template-columns: minmax(0, 1fr); }
  .controls { gap: .25rem; }
  .controls button { width: 2rem; height: 2rem; }
  .controls button#play { width: 2.4rem; height: 2.4rem; }
  .controls select { margin-left: 0; padding: .3rem .2rem; }
  .controls .sheet-btn { width: auto; height: auto; margin-left: auto; border-radius: 8px; }
  .sheet-btn { display: inline-block; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: .3rem .6rem; font-weight: 700; font-size: .82rem; cursor: pointer; }
  .side { position: fixed; left: 0; right: 0; bottom: 0; max-height: 70vh; z-index: 10; border: 1px solid var(--line); border-radius: 14px 14px 0 0; box-shadow: 0 -10px 30px rgb(0 0 0 / .5); transform: translateY(105%); transition: transform .25s; }
  body.sheet .side { transform: none; }
  .warn { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .node.reveal .inner { animation: none; }
}
/* ---- AI tutor: explanation card in the panel, linked visual over the map ---- */
.aibtn { display: grid; grid-template-columns: 2rem 1fr; gap: .1rem .6rem; align-items: center; width: 100%; text-align: left; cursor: pointer; background: rgb(127 178 255 / .1); border: 1px solid var(--accent); border-radius: 10px; padding: .55rem .7rem; margin: .2rem 0 .4rem; }
.aibtn:hover { background: rgb(127 178 255 / .2); }
.aibtn .ic { grid-row: span 2; width: 2rem; height: 2rem; border-radius: 50%; background: var(--accent); color: #0b1016; display: grid; place-items: center; }
.aibtn b { font-size: .9rem; } .aibtn small { color: var(--muted); font-size: .76rem; }
.ai { border: 1px solid var(--accent); border-radius: 10px; padding: .7rem .8rem .75rem; margin: .2rem 0 .5rem; background: rgb(127 178 255 / .06); animation: reveal .8s ease-out; }
.ai .head { display: flex; align-items: center; gap: .5rem; font: 500 .68rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.ai .head button { margin-left: auto; font: 600 .75rem var(--f-body); text-transform: none; letter-spacing: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: .15rem .6rem; cursor: pointer; }
.ai .txt { margin: .5rem 0 .4rem; font-size: .9rem; line-height: 1.55; }
.ai .txt span { color: #8796a3; transition: color .5s ease; }
.ai .txt span.said { color: #c3cfd8; }
.ai .txt span.now { color: var(--ink); }
.ai .fine { font-size: .72rem; color: var(--muted); margin: 0; }
.visual { position: absolute; z-index: 20; inset: 3.2rem 1.2rem 1.2rem; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 40px #000a; overflow: hidden; animation: reveal .9s ease-out; }
.visual[hidden] { display: none; }
.visual .bar { display: flex; align-items: center; gap: .6rem; padding: .45rem .7rem; border-bottom: 1px solid var(--line); font: 500 .7rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.visual .bar b { color: var(--ink); font: 700 .85rem var(--f-display); letter-spacing: 0; text-transform: none; }
.visual .bar a { margin-left: auto; color: var(--accent); font: 600 .78rem var(--f-body); letter-spacing: 0; text-transform: none; text-decoration: none; }
.visual .bar button { background: none; border: 0; color: var(--muted); font-size: 1.1rem; cursor: pointer; }
.visual iframe { width: 100%; height: 100%; border: 0; background: var(--bg); }

/* ---- hover tooltip: our explanation of the concept ---- */
#tip { position: fixed; z-index: 30; max-width: 19rem; padding: .55rem .7rem .6rem; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px #0008; pointer-events: none; opacity: 0; transition: opacity .25s ease; font-size: .82rem; line-height: 1.4; color: #c3cfd8; }
#tip.show { opacity: 1; }
#tip b { display: block; font-family: var(--f-display); font-size: .9rem; color: var(--ink); margin-bottom: .1rem; }
#tip small { display: block; color: var(--muted); font-size: .72rem; margin-bottom: .3rem; }
#tip .k { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
#tip .go { display: block; margin-top: .35rem; color: #5cc48a; }
@media (hover: none) { #tip { display: none; } }
</style>

<header class="top">
  <div class="brand">
    <p class="eyebrow">Chemistry · NZ Curriculum · private pilot</p>
    <h1>How ideas grow<i>.</i></h1>
  </div>
  <div class="tabs" role="tablist" aria-label="View">
    <button type="button" role="tab" data-mode="seed" aria-selected="true">Starting points</button>
    <button type="button" role="tab" data-mode="topic" aria-selected="false">Topics</button>
  </div>
  <div class="tabs years" role="group" aria-label="Year" id="years">
    <button type="button" data-year="" aria-pressed="true"><b>All</b><small>years</small></button>
    <button type="button" data-year="L5" aria-pressed="false" title="Years 9–10 foundations (no NCEA)"><b>Y9–10</b><small>Foundations</small></button>
    <button type="button" data-year="L6" aria-pressed="false" title="Year 11: chemistry strand of 11SCIa, graded by the school (no NCEA chemistry)"><b>Y11</b><small>11SCIa</small></button>
    <button type="button" data-year="L7" aria-pressed="false" title="Year 12: CHE201, NCEA Level 2"><b>Y12</b><small>NCEA L2</small></button>
  </div>
  <div class="tools">
    <div class="searchbox">
      <input id="q" type="search" placeholder="Find a concept…" aria-label="Find a concept" autocomplete="off">
      <div class="results" id="results" hidden></div>
    </div>
    <label><span>Colour</span>
      <select id="colour" aria-label="Colour by">
        <option value="lineage">Starting point</option><option value="topic">Topic</option><option value="year">Year</option>
        <option value="national">Exam weak spots</option><option value="material">Learning material</option>
      </select>
    </label>
    <a href="./" class="opt">Labs</a>
  </div>
  <div class="picker" id="picker"></div>
</header>

<main class="stage">
  <div id="tip" role="tooltip"></div>
  <div class="visual" id="visual" hidden><div class="bar">Linked visual · <b id="visualT"></b><a id="visualA" target="_blank" rel="noopener">Open the full lab ↗</a><button type="button" id="visualX" aria-label="Close the visual">×</button></div><iframe id="visualF" title="Linked visual"></iframe></div>
  <svg id="svg" role="img" aria-label="Flow of chemistry concepts from Years 9–10 to Year 12. Use the side panel lists to move between concepts."></svg>
  <div class="warn">Concepts: official sources · Links: our inference, not yet reviewed</div>
  <div class="choose" id="choose" hidden>
    <div class="card">
      <p class="eyebrow">Start here</p>
      <h2 id="chooseT"></h2>
      <p id="chooseP"></p>
      <div class="starts" id="starts"></div>
      <button type="button" class="all" data-all>Or watch the whole course grow →</button>
    </div>
  </div>
  <div class="zoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button><button type="button" id="zfit">Fit</button></div>
</main>

<footer class="player">
  <div class="controls">
    <button type="button" id="restart" aria-label="Start again">⏮</button>
    <button type="button" id="prev" aria-label="Step back">◀</button>
    <button type="button" id="play" aria-label="Play">▶</button>
    <button type="button" id="next" aria-label="Step forward">▶▏</button>
    <select id="speed" aria-label="Speed"><option value=".5">Slow</option><option value="1" selected>Normal</option><option value="2">Fast</option></select>
    <button type="button" class="sheet-btn" id="sheetBtn">Details</button>

finitions deck", "params": "deck=Definitions"}]}, {"id": "l6-ionic-properties", "tier": "L6", "topic": "Bonding & structure", "type": "conceptual", "name": "Properties of ionic solids", "description": "A 3-D lattice of ions: high melting points, brittle, and conducts only when molten or dissolved.", "evidence": ["Explain conductivity when molten but not solid", "Explain brittleness"], "sources": [{"id": "cb-slo", "ref": "92023 ionic", "quote": "Explain electrical conductivity when molten or dissolved in water, but not in solid form"}], "ben": {"course": "Curriculum Level 6", "status": "not listed in 11SCIa"}, "content": [{"page": "metals.html", "label": "Inside a Metal: why ionic crystals shatter", "params": "step=3&material=ionic"}, {"page": "properties.html", "label": "Structure & Properties: does salt conduct?", "params": "step=3&sub=salt&state=molten"}]}, {"id": "l6-covalent-networks", "tier": "L6", "topic": "Bonding & structure", "type": "conceptual", "name": "Covalent network solids", "description": "Diamond and silica are 3-D networks of covalent bonds (very hard, very high melting point); graphite's 2-D layers make it soft and conductive.", "evidence": ["Explain diamond's hardness", "Explain graphite's conductivity as an exception"], "sources": [{"id": "cb-slo", "ref": "92023 networks", "quote": "covalent network solids such as diamond and silica as 3-D (or graphite as 2-D) networks"}], "ben": {"course": "Curriculum Level 6", "status": "not listed in 11SCIa"}, "content": [{"page": "properties.html", "label": "Structure & Properties: diamond and graphite", "params": "step=4"}]}, {"id": "l6-polymers", "tier": "L6", "topic": "Bonding & structure", "type": "conceptual", "name": "Polymers", "description": "Long chain molecules of repeating units: strong bonds along the chain, weaker attractions between chains.", "evidence": ["Explain why polymers are flexible and non-conductive"], "sources": [{"id": "cb-slo", "ref": "92023 polymers", "quote": "large chain molecules made from repeating units with strong covalent bonds between atoms within the chain, but weaker attractions between the chains"}], "ben": {"course": "Curriculum Level 6", "status": "not listed in 11SCIa"}}, {"id": "l6-material-choice", "tier": "L6", "topic": "Properties & uses", "type": "conceptual", "name": "Choosing materials for a purpose", "description": "Evaluate and justify which material best suits a use from its physical properties.", "evidence": ["Justify a material choice using two or more properties"], "sources": [{"id": "cb-slo", "ref": "92023 evaluating", "quote": "Evaluate the most appropriate material ... for a specific purpose."}, {"id": "cb-matrix", "ref": "Significant Learning", "quote": "explore how materials can meet the needs of a sustainable future by relating properties to purpose and use"}], "ben": {"course": "Curriculum Level 6", "status": "not listed in 11SCIa"}}, {"id": "l7-lewis-structures", "tier": "L7", "topic": "Bonding & structure", "type": "representational", "name": "Lewis structures", "description": "Draw Lewis structures for simple molecules (no more than four electron pairs about any atom, including multiple bonds).", "evidence": ["Draw Lewis structures for molecules such as NH₃, CO₂, HCN", "Identify bonding and non-bonding regions"], "sources": [{"id": "as91164", "ref": "EN4", "quote": "Lewis structures, shape and polarity of simple molecules"}], "ben": {"course": "CHE201 · 2.4", "status": "next year"}}, {"id": "l7-molecular-shape", "tier": "L7", "topic": "Bonding & structure", "type": "conceptual", "name": "Molecular shape (VSEPR)", "description": "Repulsion between regions of electron density around a central atom decides shape and bond angle.", "evidence": ["Name the shape and bond angle of a simple molecule", "Explain shape using electron-density repulsion"], "sources": [{"id": "as91164", "ref": "EN4", "quote": "Lewis structures, shape and polarity of simple molecules"}, {"id": "report-l2-2025", "ref": "91164 Merit", "quo  "ben": {"course": "CHE201 · 2.4", "status": "next year"}}, {"id": "l7-solid-types", "tier": "L7", "topic": "Bonding & structure", "type": "conceptual", "name": "Four types of solid: structure → properties", "description": "Molecular, ionic, metallic and covalent network substances: identify the particles and forces, and use them to explain hardness, malleability, ductility, conductivity and melting points.", "evidence": ["Identify the particles and attractive forces in each type of solid", "Justify melting points and conductivity from structure and bonding"], "sources": [{"id": "as91164", "ref": "EN4–5", "quote": "molecular, ionic, metallic and covalent network substances"}, {"id": "nzc2007-science", "ref": "L7.SM.1", "quote": "relate properties of matter to structure and bonding"}], "ben": {"course": "CHE201 · 2.4", "status": "next year"}}, {"id": "l7-solubility-polarity", "tier": "L7", "topic": "Bonding & structure", "type": "conceptual", "name": "Solubility in polar and non-polar solvents", "description": "'Like dissolves like': solubility depends on polarity and the strength of solute–solvent attractions compared with those that must be overcome.", "evidence": ["Draw NaCl dissolving with hydrated ions and water dipoles", "Justify the solubility of an ionic compound and a non-polar molecule in water"], "sources": [{"id": "spec-l2-2027", "ref": "91164", "quote": "In Explanatory Note 5, solubility refers to polar and non-polar solvents."}, {"id": "report-l2-2025", "ref": "91164 Merit", "quote": "included hydrated ions in their diagram of NaCl dissolving"}], "ben": {"course": "CHE201 · 2.4", "status": "next year"}}, {"id": "l7-exo-endo", "tier": "L7", "topic": "Energy", "type": "conceptual", "name": "Exothermic and endothermic changes", "description": "Reactions and changes of state release or absorb energy; ΔH is negative for exothermic and positive for endothermic.", "evidence": ["Classify a change as exo- or endothermic with a reason", "Link the sign of ΔH to energy released or absorbed"], "sources": [{"id": "as91164", "ref": "EN4", "quote": "exothermic and endothermic reactions including energy (enthalpy) changes associated with differing amounts of substances and changes of state"}], "ben": {"course": "CHE201 · 2.4", "status": "next year"}}, {"id": "l7-moles", "tier": "L7", "topic": "Equations & quantities", "type": "procedural", "name": "The mole and molar mass", "description": "Amount of substance in moles: n = m/M using molar masses from the periodic table.", "evidence": ["Calculate moles from mass and molar mass", "Give answers to three significant figures with units"], "sources": [{"id": "as91164", "ref": "EN4", "quote": "calculations of energy changes using ΔrH and reaction stoichiometry"}, {"id": "spec-l2-2027", "ref": "General", "quote": "candidates will be expected to use the molar mass values given"}], "ben": {"course": "CHE201", "status": "next year"}}, {"id": "l7-concentration", "tier": "L7", "topic": "Equations & quantities", "type": "procedural", "name": "Concentration (n = cV)", "description": "Concentration in mol L⁻¹ links amount and volume of a solution.", "evidence": ["Use n = cV to find amount, concentration or volume"], "sources": [{"id": "spec-l2-2027", "ref": "Resources", "quote": "relevant chemical formulae needed for Level 2 Chemistry, e.g. n = cV"}], "ben": {"course": "CHE201", "status": "next year"}}, {"id": "l7-enthalpy-calcs", "tier": "L7", "topic": "Energy", "type": "procedural", "name": "Enthalpy calculations (ΔrH and stoichiometry)", "description": "Scale ΔrH to the amount of substance reacting.", "evidence": ["Calculate energy released for a given mass of fuel", "Use correct sign, units and significant figures"], "sources": [{"id": "as91164", "ref": "EN4", "quote": "calculations of energy changes using ΔrH and reaction stoichiometry"}], "ben": {"course": "CHE201 · 2.4", "status": "next year"}}, {"id": "l7-bond-enthalpy", "tier": "L7", "topic": "Energy", "type": "procedural", "name": "Bond enthalpy", "description": "Breaking bonds absorbs energy and making bonds releases it; ΔH ≈ bonds broken − bonds formed.", "evidence": ["Count the bonds broken and formed", "Calculate ΔrH from bond enthalpies"], "sources": [{"id": "as91164", "ref": "EN4", "quote": "enthalpy changes associated with the making and breaking of chemical bonds"}], "ben": {"course": "CHE201 · 2.4", "status": "next year"}}, {"id": "l7-organic-naming", "tier": "L7", "topic": "Organic", "type": "representational", "name": "Naming and drawing organic compounds", "description": "IUPAC names and structural formulae for alkanes, alkenes, alkynes, haloalkanes, primary amines, alcohols and carboxylic acids (up to eight carbons in the longest chain).", "evidence": ["Name a compound from its structural formula", "Draw a structural formula from a name"], "sources": [{"id": "as91165", "ref": "EN3", "quote": "naming and/or drawing structural formulae of selected organic compounds (no more than eight carbons in the longest chain)"}], "ben": {"course": "CHE201 · 2.5", "status": "next year"}}, {"id": "l7-functional-groups", "tier": "L7", "topic": "Organic", "type": "conceptual", "name": "Functional groups and homologous series", "description": "Recognise the functional group that defines each family and drives its reactions.", "evidence": ["Identify the functional groups in a molecule", "Tell an alcohol –OH from a hydroxide ion"], "sources": [{"id": "as91165", "ref": "EN3", "quote": "Selected organic compounds are limited to: alkanes, alkenes, alkynes, haloalkanes, primary amines, alcohols, and carboxylic acids."}, {"id": "report-l2-2024", "ref": "91165 Not Achieved", "quote": "were unable to identify the functional groups in a compound"}], "ben": {"course": "CHE201 · 2.5", "status": "next year"}}, {"id": "l7-isomers", "tier": "L7", "topic": "Organic", "type": "conceptual", "name": "Constitutional and geometric isomers", "description": "Same formula, different arrangement; cis/trans isomers need a C=C (n O/H+ ... and hydrogen halides (including identification of major and minor products"}], "ben": {"course": "CHE201 · 2.5", "status": "next year"}}, {"id": "l7-polymerisation", "tier": "L7", "topic": "Organic", "type": "conceptual", "name": "Addition polymerisation", "description": "Alkene monomers join when the double bond breaks; draw a polymer from a monomer and back.", "evidence": ["Draw the repeating unit from a monomer", "Explain why the polymer is less reactive than the monomer"], "sources": [{"id": "as91165", "ref": "EN4", "quote": "polymerisation"}], "ben": {"course": "CHE201 · 2.5", "status": "next year"}}, {"id": "l7-substitution", "tier": "L7", "topic": "Organic", "type": "conceptual", "name": "Substitution reactions", "description": "Alkanes with halogens; alcohols with hydrogen halides, PCl₃, PCl₅, SOCl₂; haloalkanes with ammonia and aqueous KOH.", "evidence": ["Give the reagent and product for a substitution"], "sources": [{"id": "as91165", "ref": "EN4", "quote": "substitution reactions of: ... alkanes with halogens ... alcohols with hydrogen halides, PCl3, PCl5, SOCl2 ... haloalkanes with ammonia and aqueous potassium hydroxide"}], "ben": {"course": "CHE201 · 2.5", "status": "next year"}}, {"id": "l7-elimination", "tier": "L7", "topic": "Organic", "type": "conceptual", "name": "Elimination reactions", "description": "Remove water from alcohols or a hydrogen halide from haloalkanes to make alkenes; asymmetric reactants give major/minor products (Zaitsev).", "evidence": ["Draw elimination products", "Justify the major product"], "sources": [{"id": "as91165", "ref": "EN4", "quote": "elimination of (including identification of major and minor products for asymmetric reactants)"}], "ben": {"course": "CHE201 · 2.5", "status": "next year"}}, {"id": "l7-organic-oxidation", "tier": "L7", "topic": "Organic", "type": "conceptual", "name": "Oxidation of alcohols and alkenes", "description": "Primary alcohols oxidise to carboxylic acids with acidified MnO₄⁻ or Cr₂O e of a catalyst"}], "ben": {"course": "CHE201 · 2.6", "status": "next year"}}, {"id": "l7-dynamic-equilibrium", "tier": "L7", "topic": "Rates & equilibrium", "type": "conceptual", "name": "Dynamic equilibrium", "description": "In a closed system forward and reverse reactions continue at equal rates, so concentrations stay constant.", "evidence": ["Explain what 'dynamic' means at equilibrium", "Use equilibrium arrows correctly"], "sources": [{"id": "as91166", "ref": "EN5", "quote": "the dynamic nature of equilibrium"}], "ben": {"course": "CHE201 · 2.6", "status": "next year"}}, {"id": "l7-equilibrium-shifts", "tier": "L7", "topic": "Rates & equilibrium", "type": "conceptual", "name": "Changing an equilibrium", "description": "Predict and explain the effect of changing temperature, concentration or pressure, or adding a catalyst, on an equilibrium.", "evidence": ["Predict the direction of shift after a stress", "Explain why a catalyst does not shift the position"], "sources": [{"id": "as91166", "ref": "EN5", "quote": "the effect of changes in temperature, concentration, pressure, or addition of a catalyst on equilibrium systems"}], "ben": {"course": "CHE201 · 2.6", "status": "next year"}}, {"id": "l7-kc", "tier": "L7", "topic": "Rates & equilibrium", "type": "procedural", "name": "The equilibrium constant Kc", "description": "Write Kc expressions for homogeneous systems, calculate Kc, and interpret its size.", "evidence": ["Write a Kc expression from an equation", "Interpret a large or small Kc"], "sources": [{"id": "as91166", "ref": "EN5", "quote": "the significance of the equilibrium constant (Kc) for homogeneous systems. This may involve calculations"}], "ben": {"course": "CHE201 · 2.6", "status": "next year"}}, {"id": "l7-proton-transfer", "tier": "L7", "topic": "Acids & bases", "type": "conceptual", "name": "Acids and bases as proton transfer", "description": "An acid donates a proton (H⁺) and a base accepts one; conjugate acid–base pairs.", "evidence": ["Identif       ${bySteps.map((s, n) => `<div class="sub">Step ${n + 2}</div><div class="list">${down.filter(i => gen[i] === s).map(i => {
        const from = inc[i].filter(k => S.has(k.from)).map(k => byId[k.from].name);
        const other = inc[i].filter(k => !S.has(k.from)).length;
        return itemBtn(i, "from " + esc(from.join(", ")) + (other ? ` · also needs ${other} idea${other === 1 ? "" : "s"} from another starting point` : ""));
      }).join("")}</div>`).join("")}
      ${year ? ctxLists() : ""}
      <div class="sub">Colour key</div>${legend()}${NOTE}`;
  } else if (!topic) {
    side.innerHTML = `<p class="eyebrow">Topics</p><h2>One area at a time</h2>
      <p>Each topic is a strand of chemistry that runs through the years. Choose one to see its ideas light up in learning order, from Years 9–10 to Year 12.</p>
      <p>Faded boxes with dashed outlines are ideas from <b>other</b> topics that this one builds on directly.</p>${NOTE}`;
  } else {
    const own = [...S].filter(i => !bridges.has(i) && !ctx.has(i)).sort((a, b) => gen[a] - gen[b]);
    const std = year && year !== "L7" ? [] : standardsOf(topic);
    const y11 = own.some(i => byId[i].tier === "L6");
    side.innerHTML = `<p class="eyebrow">Topic</p><h2>${esc(topic)}</h2><p>${esc(TOPIC_DESC[topic] || "")}</p>${yearNote()}${coverage()}
      <div class="sub">Where it is assessed</div>
      ${y11 ? `<p class="fine">Year 11: part of 11SCIa, assessed by the school.</p>` : ""}
      ${std.length ? std.map(x => `<p class="fine">Year 12: NCEA ${esc(x)}</p>`).join("") : year === "L5" ? `<p class="fine">Years 9–10: not assessed for NCEA.</p>` : year === "L6" ? "" : `<p class="fine">${y11 ? "" : "Not assessed directly before Year 12. "}No Year 12 standard is drawn from this topic.</p>`}
      ${TORDER.filter(t => own.some(i => byId[i].tier === t)).map(t => `<div class="sub">${esc(TIER_TEXT[t][0])}</div><div class="list">${own.filter(i => byId[i].tier === t).map(i => {
        const from = inc[i].filter(k => S.has(k.from)).map(k => byId[k.from].name);
        return itemBtn(i, from.length ? "builds on " + esc(from.join(", ")) : "a starting idea for this topic");
      }).join("")}</div>`).join("")}
      ${bridges.size ? `<div class="sub">Borrows from other topics (${bridges.size})</div><div class="list">${[...bridges].sort((a, b) => gen[a] - gen[b]).map(i => itemBtn(i, "from " + esc(byId[i].topic))).join("")}</div>` : ""}
      ${year ? ctxLists() : ""}
      <div class="sub">Colour key</div>${legend()}${NOTE}`;
  }
}
function renderNode(side) {
  const id = focus, c = byId[id];
  const src = c.sources?.[0], s = src && SRC[src.id];
  const ins = inc[id], outs = out[id];
  side.innerHTML = `<button type="button" class="back" data-back>← Back</button>
    <div class="crumb"><span class="dot" style="background:${colour(id)}"></span>${esc(yrTag(id))} · ${esc(c.topic)}</div>
    <h2>${esc(c.name)}</h2><div class="sub">Our explanation</div><p>${esc(c.description)}</p>
    ${heat[id] ? `<span class="tag hot">Flagged ${heat[id].length}× by NZQA examiners</span>` : ""}${benRes[id] ? `<span class="tag ben">Ben: ${esc(benRes[id].at(-1).grade)} (inferred)</span>` : ""}
    ${AI[id] ? `<div id="aiBox"><button type="button" class="aibtn" data-explain="${id}"><span class="ic">✦</span><b>Explain it to me</b><small>AI tutor · reads it aloud and shows it in the lab</small></button></div>` : ""}
    ${(c.content || []).length ? `<div class="sub">Learn it here</div>${learnLinks(c)}` : ""}
    <div class="actions"><button type="button" data-seedgo="${id}">Grow from here</button><button type="button" data-topicgo="${esc(c.topic)}">See the ${esc(c.topic)} topic</button></div>
    ${ins.length ? `<div class="sub">Builds on</div><div class="list">${ins.map(k => itemBtn(k.from, esc(k.reason) + (k.strength === "soft" ? " (helps)" : ""))).join("")}</div>` : `<div class="sub">Builds on</div><p class="fine">A starting idea: nothing earlier in this map.</p>`}
    ${outs.length ? `<div class="sub">Unlocks</div><div class="list">${outs.map(k => itemBtn(k.to, esc(k.reason))).join("")}</div>` : ""}
    ${(c.evidence || []).length ? `<div class="sub">You know it when you can (our wording)</div><ul class="ev">${c.evidence.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${heat[id] ? `<div class="sub">What examiners saw go wrong</div>${heat[id].slice(0, 4).map(n => `<div class="quote">“${esc(n.quote)}”<small>${esc(SRC[n.source]?.title || n.source)}</small></div>`).join("")}` : ""}
    ${benRes[id] ? `<div class="sub">Ben's evidence</div>${benRes[id].map(r => `<p class="fine">${esc(r.course)} · ${esc(r.assessment)}: <b>${esc(r.grade)}</b>. ${esc(r.mappingNote || "")}</p>`).join("")}` : ""}
    ${src ? `<div class="sub">Official source (exact quote)</div><div class="quote">“${esc(src.quote)}”<small>${esc(s?.title || src.id)}${src.ref ? " · " + esc(src.ref) : ""}</small></div>` : ""}`;
  side.scrollTop = 0;
}
function showNode(id, keepCam) {
  focus = id; renderSide(); paintAll();
  document.body.classList.add("sheet");
  if (!keepCam && cam.s < .7) { const p = P[id]; const v = viewSize(); const s = Math.max(cam.s, .8); camT = { s, x: p.x + NW / 2 - v.w / s / 2, y: p.y + NH / 2 - v.h / s / 2 }; }
}
document.getElementById("side").addEventListener("click", e => {
  const cl = e.target.closest("[data-colour]");
  if (cl) { e.preventDefault(); const sel = document.getElementById("colour"); sel.value = cl.dataset.colour; sel.dispatchEvent(new Event("change")); return; }
  const yl = e.target.closest("[data-year]");
  if (yl) { e.preventDefault(); return document.querySelector(`#years [data-year="${yl.dataset.year}"]`).click(); }
  const ex = e.target.closest("[data-explain]"); if (ex) return explain(ex.dataset.explain);
  if (e.target.closest("[data-aitoggle]")) { aiAudio.paused ? aiAudio.play() : aiAudio.pause(); return; }
  const t = e.target.closest("[data-node],[data-back],[data-detail],[data-seedgo],[data-topicgo]"); if (!t) return;
  stopExplain();
  if (t.dataset.back !== undefined) { focus = null; renderSide(); paintAll(); return; }
  if (t.dataset.seedgo) return setScenario("seed", [t.dataset.seedgo]);
  if (t.dataset.topicgo) return setScenario("topic", t.dataset.topicgo);
  showNode(t.dataset.node || t.dataset.detail);
});
// ---------- AI tutor (proof of concept) ----------
// Pre-generated explanations (map/ai/explanations.json): the voice plays, the sentence being read lights up,
// and cue times move the linked lab on, so the words and the visual stay together.
const AI = D.ai || {}, aiAudio = new Audio();
let aiCur = null, aiStep = 0;
const visual = document.getElementById("visual"), visualF = document.getElementById("visualF");
function explain(id) {
  const x = AI[id]; if (!x) return;
  stopExplain(); aiCur = id; aiStep = 0;
  playing = false; setPlayBtn();  // one thing at a time: pause the map while the tutor talks
  document.getElementById("aiBox").innerHTML = `<div class="ai"><div class="head">✦ AI-generated explanation<button type="button" data-aitoggle>❚❚ Pause</button></div>
    <p class="txt">${x.sentences.map((t, i) => `<span data-i="${i}">${esc(t.text)}</span>`).join(" ")}</p>
    <p class="fine">Written by an AI tutor for a Year 11 student, based on the official source below. Voice: ${esc(x.voice)}.</p></div>`;
  if (x.visual) {
    const url = SITE + x.visual.page;
    document.getElementById("visualT").textContent = x.visual.label;
    document.getElementById("visualA").href = url;
    visualF.src = url + "?embed&step=1"; visual.hidden = false;
  }
  aiAudio.src = x.audio; aiAudio.currentTime = 0;
  // Give the lab a moment to appear before the voice starts.
  setTimeout(() => { if (aiCur === id) aiAudio.play().catch(() => {}); }, 900);
}
function stopExplain() { aiAudio.pause(); aiCur = null; visual.hidden = true; visualF.removeAttribute("src"); }
aiAudio.addEventListener("timeupdate", () => {
  const x = AI[aiCur]; if (!x) return;
  const t = aiAudio.currentTime; let now = 0;
  x.sentences.forEach((s, i) => { if (t >= s.at) now = i; });
  document.querySelectorAll(".ai .txt span").forEach((el, i) => { el.classList.toggle("now", i === now); el.classList.toggle("said", i < now); });
  const step = Math.max(...x.sentences.slice(0, now + 1).map(s => s.step || 0));
  if (step && step !== aiStep) { aiStep = step; visualF.contentWindow?.postMessage({ [x.visual.param]: step }, "*"); }
});
const aiBtn = () => document.querySelector("[data-aitoggle]");
aiAudio.addEventListener("play", () => { const b = aiBtn(); if (b) b.textContent = "❚❚ Pause"; });
aiAudio.addEventListener("pause", () => { const b = aiBtn(); if (b) b.textContent = aiAudio.ended ? "↺ Again" : "▶ Play"; });
aiAudio.addEventListener("ended", () => { aiAudio.currentTime = 0; });
document.getElementById("visualX").onclick = stopExplain;

document.getElementById("sheetBtn").onclick = () => document.body.classList.toggle("sheet");

// ---------- Colour, search, keys ----------
document.getElementById("colour").onchange = e => { colourBy = e.target.value; paintAll(); renderSide(); caption([...S].filter(i => gen[i] === step)); };
const q = document.getElementById("q"), results = document.getElementById("results");
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase();
  if (!s) { results.hidden = true; return; }
  const hits = C.filter(c => (c.name + " " + c.description + " " + c.topic).toLowerCase().includes(s)).slice(0, 8);
  const verb = mode === "topic" ? "show its topic" : "grow from";
  results.innerHTML = hits.length ? hits.map(c => `<button type="button" data-hit="${c.id}">${esc(c.name)} <small>· ${esc(yrTag(c.id))} · ${verb}</small></button>`).join("") : `<button type="button" disabled>No match</button>`;
  results.hidden = false;
});
q.addEventListener("keydown", e => { if (e.key === "Enter") results.querySelector("[data-hit]")?.click(); if (e.key === "Escape") results.hidden = true; });
results.addEventListener("click", e => {
  const b = e.target.closest("[data-hit]"); if (!b) return;
  results.hidden = true; q.value = ""; q.blur();
  const id = b.dataset.hit;
  if (mode === "topic") { setScenario("topic", byId[id].topic, { still: true }); showNode(id); } else setScenario("seed", [id]);
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select")) return;
  if (e.key === " ") { e.preventDefault(); document.getElementById("play").click(); }
  if (e.key === "ArrowRight") document.getElementById("next").click();
  if (e.key === "ArrowLeft") document.getElementById("prev").click();
  if (e.key === "Escape" && focus) { focus = null; renderSide(); paintAll(); document.body.classList.remove("sheet"); }
});

// ---------- Start: #seeds=<id>,<id> (or #seed=<id>), #all, #topics, #topic=<slug>, ?colour=national; else the "choose a starting point" prompt ----------
function start() {
  buildNodes(); applyCam();
  const c = new URLSearchParams(location.search).get("colour");
  if (c && document.querySelector(`#colour option[value="${CSS.escape(c)}"]`)) { colourBy = c; document.getElementById("colour").value = c; }
  const noplay = new URLSearchParams(location.search).has("still");
  const m = location.hash.match(/^#(seeds?|topic)=([\w,-]+)/);
  const ids = m ? m[2].split(",").filter(i => byId[i]) : [];
  year = yearOf(location.hash.match(/[#&]y=(\d+)/)?.[1]);
  const hash = location.hash.replace(/&?y=\d+$/, "");
  if (hash === "#all") setScenario("seed", [...ROOTS], { instant: true, noplay });
  else if (hash === "#topics") setScenario("topic", null, { instant: true });
  else if (m && m[1] === "topic" && topicOf(m[2])) setScenario("topic", topicOf(m[2]), { instant: true, noplay });
  else setScenario("seed", ids, { instant: true, noplay });
  const st = new URLSearchParams(location.search).get("step");
  if (st !== null) showStep(+st, false);
  requestAnimationFrame(tick);
}
let started = false;
const go = () => { if (!started) { started = true; start(); } };
document.fonts?.ready.then(go); setTimeout(go, 1200);
</script>
